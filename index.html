<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biblioteca da Antiguidade</title>
<meta name="description" content="Biblioteca pessoal da Antiguidade: obras, estudos e trilhas de leitura.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23b3261e%27/%3E%3Cpath d=%27M9 24V9m5 15V9m5 15l4-15M7 25h18%27 stroke=%27white%27 stroke-width=%272.4%27 stroke-linecap=%27round%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE everyday, calm: a reading tool used daily on a phone
   IDEA a real bookshelf: every book is a spine, coloured by its tradition
   PICTURE the shelf on the home screen, one row per tradition, read books filled in
   COLOUR white / near-black night, ink, pompeian red accent, museum pigments for traditions
   TYPE Marcellus (Roman inscription) for titles + Manrope for text
   LAYOUT one column, bottom tab bar, full-screen sheet for each book; 720px centred column */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#121112);--ink:light-dark(#1b1a19,#ecebe8);--mut:light-dark(#6d6a66,#a29e98);--line:light-dark(#ebe8e4,#2a2829);--soft:light-dark(#f6f4f1,#1b1a1b);--acc:light-dark(#b3261e,#ef6a5f);--pill:light-dark(#1b1a19,#ecebe8);--pillink:light-dark(#fff,#121112)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.5 Manrope,system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main,.sheet-in{max-width:720px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px))}
.top{padding:calc(20px + env(safe-area-inset-top,0px)) 0 8px}
h1,h2{font-family:Marcellus,Georgia,serif;font-weight:400;letter-spacing:-.01em;line-height:1.08;margin:0;text-wrap:balance}
h1{font-size:clamp(30px,8vw,40px)}
h2{font-size:clamp(26px,7vw,34px)}
h3{font-size:15px;font-weight:700;margin:28px 0 10px}
.sub,.muted{color:var(--mut);font-size:14px;margin:4px 0 0}
.figs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:18px 0 6px}
.fig{padding:10px 0;border-top:2px solid var(--ink)}
.fig b{display:block;font-family:Marcellus,serif;font-weight:400;font-size:clamp(26px,8vw,36px);line-height:1}
.fig span{font-size:13px;color:var(--mut)}
.fig.acc{border-color:var(--acc)}.fig.acc b{color:var(--acc)}
.seg{display:flex;gap:4px;background:var(--soft);border-radius:12px;padding:4px;margin:14px 0 8px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px 6px;font-size:14px;font-weight:600;color:var(--mut);min-height:40px}
.seg button[aria-pressed=true]{background:var(--bg);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.12)}
.shelf{margin-top:6px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;width:100%;border:0;background:none;padding:10px 0 0;text-align:left}
.srow .sl{font-size:14px;font-weight:600}
.srow .sn{font-size:13px;color:var(--mut);font-variant-numeric:tabular-nums}
.spines{grid-column:1/-1;display:flex;align-items:flex-end;gap:2px;height:40px;border-bottom:2px solid var(--ink);padding:0 2px}
.sp{flex:1 1 0;max-width:13px;border-radius:2px 2px 0 0;background:var(--line);height:var(--h)}
.sp.lido{background:var(--c)}
.sp.tenho{background:color-mix(in srgb,var(--c) 32%,var(--bg))}
.sp.lendo{background:color-mix(in srgb,var(--c) 32%,var(--bg));box-shadow:inset 0 0 0 2px var(--acc)}
.legend{font-size:13px;color:var(--mut);margin:12px 0 0;display:flex;flex-wrap:wrap;gap:6px 14px}
.legend i{display:inline-block;width:9px;height:14px;border-radius:2px;margin-right:5px;vertical-align:-2px;background:var(--line)}
.item{display:grid;grid-template-columns:5px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:12px 0;min-height:56px}
.item .spine{align-self:stretch;border-radius:3px;background:var(--c)}
.item b{display:block;font-weight:600;font-size:16px;line-height:1.3}
.meta{display:block;font-size:13px;color:var(--mut);margin-top:2px}
.badges{display:flex;gap:6px;align-items:center}
.pill{font-size:12px;font-weight:700;border-radius:99px;padding:3px 9px;white-space:nowrap;border:1.5px solid var(--ink)}
.pill.Lido{background:var(--pill);color:var(--pillink);border-color:var(--pill)}
.pill.Tenho{border-color:var(--mut);color:var(--mut)}
.pill.Lendo{background:var(--acc);border-color:var(--acc);color:#fff}
.pill.Quero{border-style:dashed}
.p1{font-style:normal;font-size:12px;font-weight:700;color:var(--acc)}
.gh{font-size:13px;color:var(--mut);font-weight:600;margin:22px 0 0;padding-bottom:6px;border-bottom:1px solid var(--line)}
.filters{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 6px;border-bottom:1px solid var(--line)}
input[type=search],input[type=text],input[type=password],input[type=date],select,textarea{width:100%;font-size:16px;border:1px solid var(--line);background:var(--soft);border-radius:11px;padding:11px 12px;min-height:44px}
textarea{min-height:96px;resize:vertical}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips button{flex:none;border:1.5px solid var(--line);background:none;border-radius:99px;padding:7px 13px;font-size:14px;font-weight:600;min-height:38px}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:6px}
.row3 select{font-size:14px;padding:9px 8px}
.btn{border:0;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 18px;font-weight:700;min-height:46px}
.btn.ghost{background:none;color:var(--ink);border:1.5px solid var(--line)}
.btn.wide{width:100%;margin-top:18px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.btnrow .btn{flex:1 1 160px}
.empty{color:var(--mut);font-size:15px;padding:18px 0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--mut);padding:6px 0;min-height:50px}
nav.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current=page]{color:var(--acc)}
.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;transform:translateY(100%);transition:transform .22s ease;visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.sheet-in{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.sh-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 0 10px;position:sticky;top:0;background:var(--bg);z-index:2}
.back{border:0;background:none;font-weight:700;font-size:16px;padding:10px 0;min-height:44px}
.trtag{font-size:13px;font-weight:700;color:var(--c);text-align:right}
.au{color:var(--mut);margin:6px 0 0}
.stseg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin:18px 0 0}
.stseg button{border:1.5px solid var(--line);background:none;border-radius:10px;padding:10px 2px;font-weight:700;font-size:14px;min-height:46px}
.stseg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stseg button[data-st=Lendo][aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.g2 label,.field{display:block;font-size:13px;font-weight:600;color:var(--mut)}
.g2 label input,.field input,.field select,.field textarea{margin-top:5px;color:var(--ink)}
.g2 .full{grid-column:1/-1}
.stars{display:flex;gap:2px;margin-top:10px;align-items:center}
.stars span{font-size:13px;font-weight:600;color:var(--mut);margin-right:8px}
.stars button{border:0;background:none;font-size:24px;line-height:1;padding:8px 4px;color:var(--line);min-width:40px;min-height:44px}
.stars button.on{color:var(--acc)}
dl.info{margin:20px 0 0;border-top:1px solid var(--line)}
dl.info div{display:grid;grid-template-columns:8.5em minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
dl.info dt{font-size:13px;color:var(--mut);font-weight:600}
dl.info dd{margin:0;font-size:15px}
.links button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 0;min-height:44px}
.links button span{display:block;font-size:13px;color:var(--mut)}
.note{padding:12px 0;border-bottom:1px solid var(--line)}
.note blockquote{margin:0;font-family:Marcellus,serif;font-size:18px;line-height:1.4;border-left:3px solid var(--acc);padding-left:12px}
.note p{margin:0;white-space:pre-wrap}
.note .nm{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:13px;color:var(--mut);margin-top:6px}
.note .nm button{border:0;background:none;color:var(--mut);font-size:13px;padding:6px 0;min-height:36px}
.note .nb{border:0;background:none;padding:0;font-weight:700;font-size:13px;color:var(--ink);text-align:left}
details.trl{border-bottom:1px solid var(--line);padding:4px 0}
details.trl summary{list-style:none;cursor:pointer;padding:14px 0 12px}
details.trl summary::-webkit-details-marker{display:none}
.trl .tn{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:17px}
.trl .tn span{font-weight:600;font-size:14px;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.trl .tp{font-size:14px;color:var(--mut);margin:2px 0 8px}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:9px}
.nx{font-size:14px;margin-top:8px}.nx b{color:var(--acc)}
ol.steps{list-style:none;margin:0 0 10px;padding:0;counter-reset:s}
ol.steps li button{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:9px 0;min-height:44px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--mut)}
.dot.Lido{background:var(--ink);border-color:var(--ink)}.dot.Lendo{border-color:var(--acc);background:var(--acc)}.dot.Tenho{border-color:var(--ink)}
.pub{margin-top:24px}
.pub h3{display:flex;justify-content:space-between;margin:0;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.pub h3 span{color:var(--mut);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:40;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.syncnote{font-size:13px;color:var(--acc);margin:6px 0 0}
@media(prefers-reduced-motion:reduce){.sheet,.toast{transition:none}}
/* landing + login */
body.out{padding-bottom:0}
body.out nav.tabs{display:none}
.hero{padding:calc(28px + env(safe-area-inset-top,0px)) 0 0}
.hero h1{font-size:clamp(40px,11vw,64px);line-height:1.02}
.hero .lead{font-size:17px;color:var(--mut);max-width:34em;margin:14px 0 0}
.wall{margin:26px 0 0}
.wall .spines{height:64px;border-bottom-width:3px;gap:2px}
.wall .sp{max-width:none;background:var(--c)}
.wall .shelfgap{height:12px}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0 0}
.cta .btn{flex:1 1 180px;font-size:17px;min-height:52px}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:28px 0 0}
.nums div{border-top:2px solid var(--ink);padding-top:8px}
.nums b{display:block;font-family:Marcellus,serif;font-weight:400;font-size:clamp(28px,8vw,40px);line-height:1}
.nums span{font-size:13px;color:var(--mut)}
.trads{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px;margin-top:6px}
.trads div{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.trads div span:first-child{display:flex;gap:8px;align-items:baseline}
.trads i{width:8px;height:14px;border-radius:2px;background:var(--c);flex:none;align-self:center}
.trads em{font-style:normal;color:var(--mut);font-variant-numeric:tabular-nums}
.tlist{columns:2 16em;column-gap:18px;margin:6px 0 0;padding:0;list-style:none}
.tlist li{break-inside:avoid;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.tlist li span{display:block;font-size:13px;color:var(--mut)}
.foot{color:var(--mut);font-size:13px;margin:36px 0 28px}
.login{min-height:100svh;display:grid;align-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 0 40px;max-width:420px;margin:0 auto}
.login .mini{margin-bottom:26px}
.login .mini .spines{height:44px}
.login .mini .sp{max-width:none;background:var(--c)}
.login label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin-top:22px}
.pw{position:relative;margin-top:6px}
.pw input{padding-right:84px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:14px;font-weight:600;color:var(--mut);padding:8px;min-height:40px}
.err{color:var(--acc);font-size:14px;font-weight:600;min-height:22px;margin:10px 0 0}
.linkbtn{border:0;background:none;color:var(--mut);font-weight:600;padding:12px 0;min-height:44px}
.tools{margin-top:30px;border-top:1px solid var(--line);padding-top:6px}
.tools button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:13px 0;font-weight:600;min-height:48px}
.tools button span{display:block;font-weight:400;font-size:13px;color:var(--mut)}
@media(max-width:600px){.trads{grid-template-columns:minmax(0,1fr)}}
.isbnrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:6px}
.isbnrow .btn{min-height:44px;padding:10px 16px}
.scanbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:16px}
.scanbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.scanbox{position:relative;border-radius:16px;overflow:hidden;background:#000;margin-top:14px;aspect-ratio:4/3}
.scanbox video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scanframe{position:absolute;inset:32% 9%;border:2px solid rgb(255 255 255/.9);border-radius:10px}
.scanline{position:absolute;left:12%;right:12%;top:50%;height:2px;background:#ef6a5f;box-shadow:0 0 10px #ef6a5f}
.scanmsg{font-size:14px;color:var(--mut);margin:10px 0 0}
.found{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:start;margin-top:16px;padding:12px;border:1px solid var(--line);border-radius:14px}
.found img{width:64px;border-radius:4px;box-shadow:0 1px 3px rgb(0 0 0/.25)}
.found .nocap{width:64px;height:92px;border-radius:4px;background:var(--soft)}
.found b{display:block;line-height:1.3}
.match{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--soft)}
.match p{margin:0 0 6px;font-size:14px;font-weight:600}
.match button{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:10px 0;min-height:44px}
.match button span{display:block;font-size:13px;color:var(--mut)}
.cover{float:right;width:84px;margin:4px 0 10px 14px;border-radius:4px;box-shadow:0 1px 4px rgb(0 0 0/.25)}
@media(prefers-reduced-motion:no-preference){.scanline{animation:sl 1.6s ease-in-out infinite alternate}@keyframes sl{from{transform:translateY(-34px)}to{transform:translateY(34px)}}}
</style>
</head>
<body class="out">
<main id="main"><p class="empty" style="padding-top:40px">Abrindo a estante…</p></main>
<nav class="tabs" aria-label="Seções">
<button data-tab="inicio"><svg viewBox="0 0 24 24"><path d="M4 20V9l8-5 8 5v11"/><path d="M9 20v-6h6v6"/></svg>Início</button>
<button data-tab="estante"><svg viewBox="0 0 24 24"><path d="M5 4v16M9 4v16M13 5l4 15M3 20h18"/></svg>Estante</button>
<button data-tab="trilhas"><svg viewBox="0 0 24 24"><circle cx="6" cy="18" r="2"/><circle cx="18" cy="6" r="2"/><path d="M8 18h5a3 3 0 0 0 0-6h-2a3 3 0 0 1 0-6h5"/></svg>Trilhas</button>
<button data-tab="compras"><svg viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>Compras</button>
<button data-tab="notas"><svg viewBox="0 0 24 24"><path d="M7 7h4v4c0 3-2 5-4 6M15 7h4v4c0 3-2 5-4 6"/></svg>Notas</button>
</nav>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="sheet-in" id="sheetIn"></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
{
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const PAL=["#b3261e","#c76b29","#c99a10","#6b8e23","#2e7d6b","#2b6cb0","#4b3f9e","#8e3b8a","#a14a5f","#5c6b73","#8a6d3b","#3f7f3f","#1f5f8b","#7a4e2d"];
const TIPOS={F:"Fontes",E:"Estudos",R:"Recepção"};
const STS=["Quero","Tenho","Lendo","Lido"];
const TABS=["inicio","estante","trilhas","compras","notas"];
const PUBS=["Editora 34","Penguin-Companhia","Companhia das Letras","Autêntica","Perspectiva","Iluminuras","Ateliê","Mnema","Hedra","Edipro","Edusp","Editora Unesp","Unesp","Editora UnB","UnB","Martins Fontes","Zahar","Cultrix","Kotter","7Letras","Vozes","Gulbenkian","Edições 70","Editora UFMG","Editora da Unicamp","Unicamp","Alameda","Annablume","Paz e Terra","Planeta","Record","Contexto","Graal","Difel","Escuta","Relicário","Mauad","Brasiliense","Imago","Paulus","Fiocruz","Presença","Verbo","Humanitas","Coimbra","Uesb","Unifesp","Edusc","Principis","Atual","Cotovia","Segesta","Loeb","Oxford","Cambridge","Harvard","Blackwell","Wiley","Routledge","Johns Hopkins","Princeton"];
const API="/api/dados";
let CAT=[],TRILHAS=[],PASS="",syncMsg="";
const S={est:{},notas:{},extras:{}};
const V={auth:false,tab:"inicio",shelf:"F",tipo:"F",q:"",st:"",tr:"",pr:"",sort:"ord",nq:"",nt:"",open:null,ntype:"citacao",showpw:false,err:""};
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
try{const {tab,shelf,tipo,st,tr,pr,sort}=JSON.parse(ls.get("ba-view")||"{}");Object.assign(V,JSON.parse(JSON.stringify({tab,shelf,tipo,st,tr,pr,sort})))}catch(e){}
const keepView=()=>{const {tab,shelf,tipo,st,tr,pr,sort}=V;ls.set("ba-view",JSON.stringify({tab,shelf,tipo,st,tr,pr,sort}))};
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const fmtD=s=>s?s.split("-").reverse().join("/"):"";
const all=()=>CAT.concat(Object.values(S.extras));
const byId=id=>all().find(b=>b.id===id);
const stOf=b=>{const e=S.est[b.id];return e&&("status" in e)?e.status:(b.st0||"")};
const TRC={};
const colOf=tr=>{if(!(tr in TRC))TRC[tr]=PAL[Object.keys(TRC).length%PAL.length];return TRC[tr]};
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),2400)};
const pill=s=>s?`<span class="pill ${esc(s)}">${esc(s)}</span>`:"";
const groups=L=>{const m=new Map();L.forEach(b=>{if(!m.has(b.tr))m.set(b.tr,[]);m.get(b.tr).push(b)});return m};
const plural=(n,a,b)=>n+" "+(n===1?a:b);

/* ---------- servidor ---------- */
async function api(method,body){
  const r=await fetch(API,{method,headers:{"content-type":"application/json","x-app-password":PASS},body:body?JSON.stringify(body):undefined});
  if(r.status===401){const e=new Error("senha");e.code=401;throw e}
  if(!r.ok){const e=new Error("servidor");e.code=r.status;throw e}
  return r.json();
}
const cache=()=>ls.set("ba-cache",JSON.stringify(S));
async function pull(){
  const d=await api("GET");
  S.est=d.est||{};S.notas=d.notas||{};S.extras=d.extras||{};
  for(const k in S.notas)S.notas[k].id=k;for(const k in S.extras)S.extras[k].id=k;
  syncMsg="";cache();render();
}
const chains={};
const queue=(k,fn)=>{chains[k]=(chains[k]||Promise.resolve()).then(fn).then(()=>{if(syncMsg){syncMsg="";render()}}).catch(e=>{
  if(e.code===401)return logout("Sua senha mudou. Entre de novo.");
  syncMsg="Sem conexão: a última mudança não foi salva no servidor.";toast("Não foi salvo. Confira a internet.");render()});return chains[k]};
function put(coll,id,obj){
  if(obj===null)delete S[coll][id];else S[coll][id]=obj;
  cache();render();
  queue(coll+"/"+id,()=>api("POST",{coll,id,value:obj}));
}
const setEst=(id,patch)=>put("est",id,Object.assign({},S.est[id]||{},patch));
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

async function login(p){
  PASS=p;V.err="";
  const btn=$("#lg-go");if(btn){btn.disabled=true;btn.textContent="Entrando…"}
  try{await pull();ls.set("ba-pass",p);V.auth=true;document.body.classList.remove("out");V.tab=TABS.includes(V.tab)?V.tab:"inicio";location.hash=V.tab;render();toast("Bem-vinda de volta")}
  catch(e){PASS="";V.err=e.code===401?"Senha incorreta.":e.code===500?"O servidor não está configurado (veja o README).":"Não consegui falar com o servidor. Confira a internet.";render();setTimeout(()=>$("#lg-pw")&&$("#lg-pw").focus(),30)}
}
function logout(msg){PASS="";ls.del("ba-pass");ls.del("ba-cache");S.est={};S.notas={};S.extras={};V.auth=false;V.open=null;$("#sheet").classList.remove("on");V.err=msg||"";V.tab="login";location.hash="login";render()}

function wall(L,rowsN,cls){
  let seed=11;const rnd=()=>(seed=seed*16807%2147483647)/2147483647;
  const per=Math.ceil(L.length/rowsN),rows=[];
  for(let i=0;i<L.length;i+=per)rows.push(L.slice(i,i+per));
  return `<div class="${cls}" aria-hidden="true">${rows.map((r,i)=>`${i?'<div class="shelfgap"></div>':""}<div class="spines">${r.map(b=>`<i class="sp" style="--c:${colOf(b.tr)};--h:${Math.round(55+rnd()*45)}%"></i>`).join("")}</div>`).join("")}</div>`;
}

function renderList(){
  document.querySelectorAll("#tipo button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===V.tipo));
  document.querySelectorAll("#stf button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===V.st));
  const base=all().filter(b=>!V.tipo||b.tp===V.tipo),trs=[...new Set(base.map(b=>b.tr))];
  if(V.tr&&!trs.includes(V.tr))V.tr="";
  $("#trf").innerHTML=`<option value="">${V.tipo==="E"?"Categoria":"Tradição"}</option>`+trs.map(t=>`<option${t===V.tr?" selected":""}>${esc(t)}</option>`).join("");
  $("#prf").value=V.pr;$("#sortf").value=V.sort;
  const q=V.q.trim().toLowerCase();
  let L=base.filter(b=>{const s=stOf(b);
    if(V.st==="-"?s:V.st&&s!==V.st)return false;
    if(V.tr&&b.tr!==V.tr)return false;
    if(V.pr&&String(b.pr)!==V.pr)return false;
    if(q&&!`${b.ti} ${b.au} ${b.ed||""} ${b.tr} ${(S.est[b.id]||{}).edicao||""}`.toLowerCase().includes(q))return false;

  <p class="scanmsg" id="isbn-msg">${esc(d.msg||"")}</p>
  ${d.ti?`<div class="found">${/^https:\/\//.test(d.capa||"")?`<img src="${esc(d.capa)}" alt="">`:`<span class="nocap"></span>`}<div><b>${esc(d.ti)}</b><span class="meta">${esc(d.au||"")}${d.ed?" · "+esc(d.ed):""}</span></div></div>`:""}
  ${d.match&&d.match.length?`<div class="match"><p>Já está no catálogo? Toque para marcar como “Tenho”.</p>${d.match.map(id=>{const b=byId(id);return b?`<button data-claim="${esc(b.id)}">${esc(b.ti)}<span>${esc(b.au)} · ${esc(b.tr)}</span></button>`:""}).join("")}</div>`:""}
  <div class="g2"><label class="full">Título<input type="text" id="a-ti" value="${esc(d.ti||"")}"></label><label class="full">Autor(a)<input type="text" id="a-au" value="${esc(d.au||"")}"></label>
  <label>Tipo<select id="a-tp"><option value="F">Fonte antiga</option><option value="E">Estudo</option><option value="R">Recepção</option></select></label>
  <label>Prioridade<select id="a-pr"><option value="1">1 · Núcleo</option><option value="2" selected>2 · Essencial</option><option value="3">3 · Aprofundar</option><option value="4">4 · Hiperfoco</option></select></label>
  <label class="full">Tradição ou categoria<select id="a-tr">${trs.map(t=>`<option>${esc(t)}</option>`).join("")}</select></label>
  <label>Data<input type="text" id="a-dt" placeholder="séc. V a.C."></label><label>Status<select id="a-st"><option value="Quero">Quero</option><option>Tenho</option><option>Lendo</option><option>Lido</option><option value="">—</option></select></label>
  <label class="full">Edição<input type="text" id="a-ed" placeholder="Tradutor, editora" value="${esc(d.ed||"")}"></label><label class="full">Por que ler<textarea id="a-why"></textarea></label></div>
  <button class="btn wide" data-saveadd>Adicionar à estante</button>`;
}

/* ---------- ISBN ---------- */
let ADD={},scan=null,zxingP=null;
const norm=x=>String(x||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
const isIsbn=c=>{c=String(c||"").replace(/\D/g,"");if(!/^97[89]\d{10}$/.test(c))return false;let t=0;for(let i=0;i<12;i++)t+=(+c[i])*(i%2?3:1);return (10-t%10)%10===+c[12]};
const isbnFrom=v=>{const c=String(v||"").replace(/[^\dXx]/g,"");if(isIsbn(c))return c;
  if(/^\d{9}[\dXx]$/.test(c)){const b="978"+c.slice(0,9);let t=0;for(let i=0;i<12;i++)t+=(+b[i])*(i%2?3:1);return b+((10-t%10)%10)}return ""};
const loadZXing=()=>zxingP||(zxingP=new Promise((ok,no)=>{const sc=document.createElement("script");sc.src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js";sc.onload=()=>window.ZXing?ok():no();sc.onerror=no;document.head.appendChild(sc)}));
function keepDraft(){const g=id=>{const el=$("#"+id);return el?el.value:undefined};["ti","au","ed"].forEach(k=>{const v=g("a-"+k);if(v!==undefined)ADD[k]=v});const i=g("a-isbn");if(i!==undefined)ADD.isbn=i}
function stopScan(){if(scan){try{scan.stop()}catch(e){}scan=null}const sb=$("#scan");if(sb)sb.hidden=true;const bt=$("[data-scan]");if(bt)bt.hidden=false}
async function startScan(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return toast("Este navegador não abre a câmera. Digite o ISBN.");
  $("#scan").hidden=false;$("[data-scan]").hidden=true;
  const video=$("#scan-v"),msg=$("#scan-msg");msg.textContent="Abrindo a câmera…";
  const cam={video:{facingMode:{ideal:"environment"}},audio:false};
  try{
    let native=false;
    if("BarcodeDetector" in window){try{native=(await BarcodeDetector.getSupportedFormats()).includes("ean_13")}catch(e){}}
    if(native){
      const stream=await navigator.mediaDevices.getUserMedia(cam);video.srcObject=stream;await video.play();
      const det=new BarcodeDetector({formats:["ean_13"]});
      const me={stop:()=>stream.getTracks().forEach(t=>t.stop())};scan=me;
      const loop=async()=>{if(scan!==me)return;try{const r=await det.detect(video);const c=r.map(x=>x.rawValue).find(isIsbn);if(c)return found(c)}catch(e){}setTimeout(loop,180)};loop();
    }else{
      await loadZXing();
      const hints=new Map([[ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13]]]);
      const reader=new ZXing.BrowserMultiFormatReader(hints,250);
      const me={stop:()=>reader.reset()};scan=me;
      await reader.decodeFromConstraints(cam,video,res=>{if(res&&scan===me&&isIsbn(res.getText()))found(res.getText())});
    }
    msg.textContent="Aponte para o código de barras atrás do livro.";
  }catch(e){stopScan();toast(e&&e.name==="NotAllowedError"?"Permita a câmera nas configurações do navegador":"Não consegui abrir a câmera. Digite o ISBN.")}
}
function found(code){if(navigator.vibrate)navigator.vibrate(60);stopScan();keepDraft();ADD.isbn=code;lookup(code)}
async function lookup(isbn){
  ADD.msg="Buscando "+isbn+"…";renderDetail();
  let info=null;
  try{const r=await fetch("https://brasilapi.com.br/api/isbn/v1/"+isbn);if(r.ok){const j=await r.json();if(j.title)info={ti:j.title+(j.subtitle?": "+j.subtitle:""),au:(j.authors||[]).join(", "),ed:[j.publisher,j.year].filter(Boolean).join(", "),capa:j.cover_url||""}}}catch(e){}
  if(!info){try{const r=await fetch("https://www.googleapis.com/books/v1/volumes?q=isbn:"+isbn);if(r.ok){const j=await r.json();const v=j.items&&j.items[0]&&j.items[0].volumeInfo;
    if(v)info={ti:v.title+(v.subtitle?": "+v.subtitle:""),au:(v.authors||[]).join(", "),ed:[v.publisher,(v.publishedDate||"").slice(0,4)].filter(Boolean).join(", "),capa:((v.imageLinks||{}).thumbnail||"").replace(/^http:/,"https:")}}}catch(e){}}
  if(V.open!=="__add")return;
  if(!info){ADD.msg="Não encontrei esse ISBN nas bases. Preencha à mão.";ADD.match=[];return renderDetail()}
  Object.assign(ADD,info,{msg:"Encontrado. Confira os campos e salve."});
  const t=norm(info.ti);
  ADD.match=CAT.filter(b=>{const n=norm(String(b.ti).split(/[(:;]/)[0]);return n.length>=4&&(t.includes(n)||n.includes(t))}).slice(0,3).map(b=>b.id);
  renderDetail();
}

function renderDetail(){$("#sheetIn").innerHTML=detail()}
function openBook(id){V.open=id;renderDetail();const sh=$("#sheet");sh.classList.add("on");sh.scrollTop=0;setTimeout(()=>{const b=$(".back");if(b)b.focus()},60)}
function closeBook(){stopScan();V.open=null;$("#sheet").classList.remove("on")}
function showText(title,txt){V.open="__txt";$("#sheetIn").innerHTML=`<div class="sh-top"><button class="back" data-close>‹ Voltar</button></div><h2>${esc(title)}</h2><p class="muted">Selecione tudo e copie.</p><textarea style="min-height:60vh">${esc(txt)}</textarea>`;$("#sheet").classList.add("on")}

/* ---------- importar ---------- */
function parseCSV(t){const rows=[];let row=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;else if(c===","){row.push(f);f=""}else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}else f+=c}
  if(f||row.length){row.push(f);rows.push(row)}return rows}
async function importFile(file){
  const txt=await file.text();let data;
  try{
    if(txt.trim().startsWith("{")){const j=JSON.parse(txt);data={est:j.est||{},notas:j.notas||{},extras:j.extras||{}}}
    else{const r=parseCSV(txt.trim()),h=r[0].map(x=>x.trim()),ix=k=>h.indexOf(k);if(ix("id")<0||ix("status")<0)throw 0;
      data={est:{},notas:{},extras:{}};
      r.slice(1).forEach(c=>{const id=c[ix("id")];if(!id||!byId(id))return;const o={status:c[ix("status")]||""};
        [["edicao_que_tenho","edicao"],["inicio","ini"],["fim","fim"],["avaliacao","av"]].forEach(([k,n])=>{const v=c[ix(k)];if(v)o[n]=n==="av"?+v:v});
        if(o.status!==(byId(id).st0||"")||Object.keys(o).length>1)data.est[id]=o})}
  }catch(e){return toast("Arquivo não reconhecido")}
  const n=Object.keys(data.est).length+Object.keys(data.notas).length+Object.keys(data.extras).length;
  if(!n)return toast("Nada para importar nesse arquivo");
  try{await api("POST",{importar:data});await pull();toast(`Importado: ${plural(n,"item","itens")}`)}catch(e){toast("Não consegui importar. Confira a internet.")}
}

/* ---------- render ---------- */
function render(){
  document.body.classList.toggle("out",!V.auth);
  document.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===V.tab?"page":"false"));
  const m=$("#main");
  if(!CAT.length)return;
  if(!V.auth){const v=V.tab==="login"?"login":"home";if(m.dataset.v!==v||v==="login"){const keep=$("#lg-pw")?$("#lg-pw").value:"";m.innerHTML=v==="login"?loginView():landing();m.dataset.v=v;if(v==="login"){$("#lg-pw").value=keep;bindLogin()}}return}
  if(V.tab==="estante"){if(m.dataset.v!=="estante"){m.innerHTML=estanteShell();m.dataset.v="estante";bindEstante()}renderList()}
  else if(V.tab==="notas"){if(m.dataset.v!=="notas"){m.innerHTML=notasShell();m.dataset.v="notas";bindNotas()}renderNotas()}
  else{m.dataset.v=V.tab;m.innerHTML=({inicio,trilhas,compras})[V.tab]()}
  if(V.open&&V.open!=="__txt"&&V.open!=="__add"){const a=document.activeElement;if(!$("#sheet").contains(a)||a.tagName==="BUTTON")renderDetail()}
}
function bindLogin(){$("#lg-form").onsubmit=e=>{e.preventDefault();const p=$("#lg-pw").value;if(p)login(p)}}
function go(tab){V.tab=tab;if(V.auth)keepView();if(location.hash!=="#"+tab)location.hash=tab;render();window.scrollTo(0,0)}

/* ---------- eventos ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-open]");if(!t)return;const d=t.dataset;
  if(d.go){V.err="";if(d.go==="home"){V.tab="inicio";location.hash="";render();return window.scrollTo(0,0)}return go(d.go)}
  if(d.scroll){const el=$(d.scroll);if(el)el.scrollIntoView({behavior:"smooth"});return}
  if("showpw" in d){V.showpw=!V.showpw;const i=$("#lg-pw");i.type=V.showpw?"text":"password";t.textContent=V.showpw?"Ocultar":"Mostrar";return}
  if(!V.auth)return;
  if(d.tab)return go(d.tab);
  if(d.open)return openBook(d.open);
  if("close" in d)return closeBook();
  if(d.shelf){V.shelf=d.shelf;keepView();return render()}
  if(d.gotr){Object.assign(V,{tipo:V.shelf,tr:d.gotr,st:"",pr:"",q:"",sort:"ord"});return go("estante")}
  if("add" in d){ADD={};return openBook("__add")}
  if("scan" in d)return startScan();
  if("scanstop" in d)return stopScan();
  if("isbnbusca" in d){const c=isbnFrom($("#a-isbn").value);if(!c)return toast("ISBN inválido. Confira os números.");keepDraft();ADD.isbn=c;return lookup(c)}
  if(d.claim){const id=d.claim,p={status:"Tenho"};if(ADD.ed)p.edicao=ADD.ed;if(ADD.isbn)p.isbn=ADD.isbn;stopScan();setEst(id,p);openBook(id);return toast("Marcado como Tenho")}
  if("logout" in d){if(!t.dataset.sure){t.dataset.sure="1";t.firstChild.textContent="Toque de novo para sair";return}return logout("")}
  if("export" in d){const blob=new Blob([JSON.stringify({app:"biblioteca-antiguidade",exportado:new Date().toISOString(),...S},null,1)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`biblioteca-backup-${today()}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);return toast("Backup baixado")}
  if("import" in d){const i=$("#imp");i.value="";i.onchange=()=>{if(i.files[0])importFile(i.files[0])};return i.click()}
  if(d.st!==undefined&&V.open){const p={status:d.st},e0=S.est[V.open]||{};
    if(d.st==="Lendo"&&!e0.ini)p.ini=today();if(d.st==="Lido"&&!e0.fim)p.fim=today();
    setEst(V.open,p);renderDetail();return toast(d.st?"Marcado como "+d.st:"Status removido")}
  if(d.av){const n=+d.av,cur=(S.est[V.open]||{}).av||0;setEst(V.open,{av:n===cur?0:n});return renderDetail()}
  if(d.nt){V.ntype=d.nt;const keep=$("#n-txt").value,r=$("#n-ref").value;renderDetail();$("#n-txt").value=keep;$("#n-ref").value=r;return}
  if("savenote" in d){const txt=$("#n-txt").value.trim();if(!txt)return toast("Escreva o texto primeiro");
    const id=newId("n");put("notas",id,{id,livro:V.open,tipo:V.ntype,texto:txt,ref:$("#n-ref").value.trim(),criado:today(),ts:Date.now()});renderDetail();return toast("Anotação salva")}
  if(d.delnote){if(t.dataset.sure){put("notas",d.delnote,null);if(V.open)renderDetail();return toast("Anotação apagada")}t.dataset.sure="1";t.textContent="Toque de novo para apagar";return}
  if("delbook" in d){if(!t.dataset.sure){t.dataset.sure="1";t.textContent="Toque de novo para remover";return}const id=V.open;closeBook();put("extras",id,null);return toast("Livro removido")}
  if("saveadd" in d){const ti=$("#a-ti").value.trim();if(!ti)return toast("O título é obrigatório");
    const id=newId("X"),st=$("#a-st").value;
    put("extras",id,{id,tp:$("#a-tp").value,ti,au:$("#a-au").value.trim()||"—",tr:$("#a-tr").value,pr:+$("#a-pr").value,dt:$("#a-dt").value.trim(),ed:$("#a-ed").value.trim(),why:$("#a-why").value.trim(),isbn:isbnFrom($("#a-isbn").value)||"",capa:/^https:\/\//.test(ADD.capa||"")?ADD.capa:"",st0:""});
    if(st)setEst(id,{status:st});openBook(id);return toast("Adicionado à estante")}
  if("csv" in d||"copylist" in d){
    let txt;
    if("csv" in d){const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
      txt=["id,tipo,tradicao,autor,titulo,status,edicao_que_tenho,inicio,fim,avaliacao"].concat(all().map(b=>{const e=S.est[b.id]||{};return [b.id,TIPOS[b.tp]||b.tp,b.tr,b.au,b.ti,stOf(b),e.edicao,e.ini,e.fim,e.av||""].map(q).join(",")})).join("\n")}
    else txt=comprasGroups().map(([p,i])=>p+"\n"+i.map(b=>`- ${b.ti} (${b.au})`).join("\n")).join("\n\n");
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("Copiado")).catch(()=>showText("Copiar",txt));
  }
});
document.addEventListener("change",e=>{
  if(!V.auth||!V.open||V.open.startsWith("__"))return;const id=e.target.id;
  const map={"d-ed":"edicao","d-ini":"ini","d-fim":"fim"};
  if(map[id]){const v=e.target.value.trim();if(((S.est[V.open]||{})[map[id]]||"")!==v){setEst(V.open,{[map[id]]:v});toast("Salvo")}}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&V.open)closeBook()});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);
  if(!V.auth){V.tab=h==="login"?"login":"inicio";return render()}
  if(TABS.includes(h)&&h!==V.tab){V.tab=h;render()}});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&V.auth&&!V.open)pull().catch(e=>{if(e.code===401)logout("Sua senha mudou. Entre de novo.")})});

/* ---------- início ---------- */
const h0=location.hash.slice(1);
PASS=ls.get("ba-pass")||"";
if(PASS){V.auth=true;if(TABS.includes(h0))V.tab=h0;try{Object.assign(S,JSON.parse(ls.get("ba-cache")||"{}"))}catch(e){}}
else V.tab=h0==="login"?"login":"inicio";
fetch("catalog.json").then(r=>r.json()).then(j=>{CAT=j.livros;TRILHAS=j.trilhas;CAT.forEach(b=>colOf(b.tr));render();
  if(V.auth)pull().catch(e=>{if(e.code===401)logout("Sua senha mudou. Entre de novo.");else{syncMsg="Sem conexão: mostrando o que estava salvo neste aparelho.";render()}})})
  .catch(()=>{$("#main").innerHTML=`<p class="empty">Não foi possível abrir o catálogo. Recarregue a página.</p>`});
render();
}
